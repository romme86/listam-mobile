name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    name: lint + typecheck + deps + secrets + i18n + test
    runs-on: ubuntu-latest
    steps:
      # This app depends on @listam/* via `file:../listam-packages/packages/*`.
      # A single-repo checkout has no sibling directory, so npm cannot resolve
      # them and every test importing a @listam package dies with
      # ERR_MODULE_NOT_FOUND — which is why every run of this workflow failed
      # (10 pass / 17 fail in ~0.7s) before the sibling checkout below existed.
      # Recreate the local layout: $GITHUB_WORKSPACE/listam-mobile +
      # $GITHUB_WORKSPACE/listam-packages.
      - name: Checkout listam-mobile
        uses: actions/checkout@v4
        with:
          path: listam-mobile

      - name: Checkout listam-packages sibling
        uses: actions/checkout@v4
        with:
          repository: romme86/listam-packages
          path: listam-packages

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --legacy-peer-deps is REQUIRED: react-native-screens wants RN >=0.82
      # while the app pins 0.81.
      # listam-packages must be installed too, not just checked out: node
      # resolves a symlinked @listam/* package's own deps (b4a,
      # hypercore-crypto, autobase, ...) from its REAL location, walking up to
      # listam-packages/node_modules. Without this the app installs fine and
      # then every test dies with ERR_MODULE_NOT_FOUND on a transitive dep.
      - name: Install listam-packages workspace
        working-directory: listam-packages
        run: npm install --no-audit --no-fund

      # `npm install`, not `npm ci`: listam-packages is checked out at its own
      # HEAD, which need not match the revision this lockfile was resolved
      # against. install reconciles the file: links; ci would fail on the drift.
      - name: Install
        working-directory: listam-mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # Single entry point: CI runs exactly what a developer runs locally.
      # The previous version reimplemented a partial list here and silently
      # skipped `typecheck` and `check:i18n`. Never reimplement the gate list —
      # change package.json instead.
      - name: Gates
        working-directory: listam-mobile
        run: npm run ci
